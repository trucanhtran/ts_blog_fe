# Local dev: mount source for hot reload
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - node_modules_dev:/app/node_modules
    ports:
      - "3000:3000"
    command: sh -lc "npm install && npm run dev:no-turbopack"
    environment:
      - WATCHPACK_POLLING=true

volumes:
  node_modules_dev:
